[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "painter1998-snow-sma"
version = "2.1.0"
description = "Executable teaching case for snow grain size and spectral mixture analysis"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [{name = "Peijian Liu"}]
dependencies = [
  "numpy==1.26.4", "scipy==1.11.4", "matplotlib==3.8.0",
  "pandas==2.1.4", "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
notebook = [
  "nbformat==5.10.4", "nbclient==0.10.2", "nbconvert==7.16.6",
  "ipykernel==6.29.5", "jupyterlab==4.4.10",
]
full = [
  "rasterio==1.4.4", "pyproj==3.7.2", "shapely==2.1.2", "affine==2.4.0",
  "netCDF4==1.7.4", "spectral==0.25", "requests==2.32.5", "openpyxl==3.1.5",
]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[tool.setuptools.packages.find]
include = ["snowmix*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "requires_gis: requires optional geospatial dependencies",
  "full_data: requires prepared legacy cache paths or complete source inputs",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["vendor", "build", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
