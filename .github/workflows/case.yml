name: Painter teaching case

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: Notebooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: assignments/03-painter1998-snow-sma
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: assignments/03-painter1998-snow-sma/pyproject.toml
      - name: Install teaching environment
        run: python -m pip install -c requirements-lock.txt -e ".[notebook,dev]"
      - name: Core and teaching tests
        run: python -m pytest -q -m "not requires_gis and not full_data"
      - name: Prepare pinned offline formula component
        run: python scripts/build_notebooks.py --prepare-assets
      - name: Build twice, verify offline resources and source purity
        run: python scripts/check_reproducibility.py
      - name: Require clean tracked sources
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teaching-html-${{ matrix.os }}
          path: build/site
  full-unit-tests:
    name: Numerical and GIS regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/03-painter1998-snow-sma
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -c requirements-lock.txt -e ".[notebook,full,dev]"
      - run: python scripts/prepare_test_inputs.py
      - run: python -m pytest -q
      - run: python -m ruff check snowmix scripts tests
      - run: python -m ruff format --check snowmix scripts tests
  deploy:
    name: Publish teaching pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [notebooks, full-unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Download the already verified Ubuntu site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: teaching-html-ubuntu-latest
          path: build/site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
